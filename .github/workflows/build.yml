name: Build & Release

on:
  push:
    branches:
      - main
    paths:
      - 'app.py'
      - '*.py'
      - 'AgendadorESF.spec'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build executable
      run: |
        pyinstaller AgendadorESF.spec
    
    - name: Get version
      id: version
      run: |
        $version = (python -c "import re; content=open('app.py').read(); match=re.search(r'APP_VERSION = \"([^\"]+)\"', content); print(match.group(1))")
        echo "version=$version" | Out-String | Add-Content -Path $env:GITHUB_OUTPUT
    
    - name: Create Release
      if: success()
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ steps.version.outputs.version }}
        release_name: Release v${{ steps.version.outputs.version }}
        body: |
          ## AgendadorESF v${{ steps.version.outputs.version }}
          
          Baixe o arquivo `AgendadorESF.exe` abaixo para instalar a atualização.
          
          ### Instalação
          1. Baixe o arquivo `.exe`
          2. Execute-o para instalar/atualizar
          3. Reinicie o aplicativo
          
          ### Mudanças
          - Consulte o histórico do git para detalhes das mudanças
        draft: false
        prerelease: false
    
    - name: Upload Release Asset
      if: success()
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./dist/AgendadorESF_v${{ steps.version.outputs.version }}.exe
        asset_name: AgendadorESF.exe
        asset_content_type: application/octet-stream
