name: Build & Release

on:
  push:
    branches:
      - main
    paths:
      - 'app.py'
      - '*.py'
      - 'AgendadorESF.spec'
      - '.github/workflows/build.yml'
      - 'AgendadorESF-Installer.nsi'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install NSIS
      run: |
        choco install nsis -y
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Get version
      id: version
      shell: pwsh
      run: |
        $version = (Get-Content app.py | Select-String 'APP_VERSION\s*=\s*"([^"]+)"').Matches.Groups[1].Value
        if (-not $version) { $version = "1.0.1" }
        "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        Write-Host "Detected version: $version"
    
    - name: Build executable with PyInstaller
      run: |
        pyinstaller AgendadorESF.spec --noconfirm
    
    - name: Prepare portable executables
      shell: pwsh
      run: |
        $ver = "${{ steps.version.outputs.version }}"
        if (Test-Path "./dist/AgendadorESF.exe") {
          Copy-Item "./dist/AgendadorESF.exe" -Destination "./dist/AgendadorESF_v$ver.exe"
        }
    
    - name: Build NSIS Installer
      run: |
        python compile_nsis_installer.py
    
    - name: Create Release
      if: success()
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: Release v${{ steps.version.outputs.version }}
        make_latest: true
        fail_on_unmatched_files: false
        body: |
          ## AgendadorESF v${{ steps.version.outputs.version }}
          
          ### 📥 Download (Escolha uma opção)
          
          **Opção 1 - Instalador (Recomendado)**
          - Arquivo: `AgendadorESF-Setup.exe`
          - Cria atalhos na Área de Trabalho e Menu Iniciar
          - Instalação e desinstalação automática
          
          **Opção 2 - Executável Portátil**
          - Arquivo: `AgendadorESF.exe` / `AgendadorESF_v${{ steps.version.outputs.version }}.exe`
          - Executável standalone que roda sem precisar instalar
          
          ### 🚀 Instruções
          1. Baixe o instalador `AgendadorESF-Setup.exe` ou o executável portátil.
          2. Execute o arquivo baixado.
          3. O sistema manterá sua planilha `agenda_esf.xlsx` segura e preservará todos os dados!
          
          ### ℹ️ Informações da Release
          - Versão: `v${{ steps.version.outputs.version }}`
          - Data da compilação: ${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
        draft: false
        prerelease: false
        files: |
          ./dist/AgendadorESF.exe
          ./dist/AgendadorESF_v${{ steps.version.outputs.version }}.exe
          ./AgendadorESF-Setup.exe
